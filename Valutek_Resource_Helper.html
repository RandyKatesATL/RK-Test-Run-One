// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  audienceKey: null,
  history: [],
  currentQId: "q1",
  resultKey: null
};

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function updateProgress() {
  const steps = state.history.length + (state.resultKey ? 1 : 0);
  document.getElementById('step-label').textContent = 'Step ' + (steps + 1);
  for (let i = 0; i < 4; i++) {
    const bar = document.getElementById('pb' + i);
    bar.classList.toggle('active', i <= steps);
  }
}

function renderAudience() {
  hide('screen-question');
  hide('screen-result');
  hide('progress-bar');
  hide('btn-reset');
  show('screen-audience');
}

function renderQuestion() {
  const flow = FLOWS[state.audienceKey];
  const q = flow.questions[state.currentQId];

  document.getElementById('q-audience').textContent = flow.label;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('q-subtitle').textContent = q.subtitle || '';

  const container = document.getElementById('q-options');
  container.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.innerHTML = '<span>' + opt.label + '</span><span class="arrow">→</span>';
    btn.onclick = () => handleAnswer(opt);
    container.appendChild(btn);
  });

  hide('screen-audience');
  hide('screen-result');
  show('screen-question');
  show('progress-bar');
  show('btn-reset');
  updateProgress();
}

function renderResult() {
  const flow = FLOWS[state.audienceKey];
  const r = flow.results[state.resultKey];

  document.getElementById('result-header').style.background = r.color;
  document.getElementById('result-icon').textContent = r.icon;
  document.getElementById('result-category').textContent = r.category;
  document.getElementById('result-headline').textContent = r.headline;
  document.getElementById('result-description').textContent = r.description;

  const linksList = document.getElementById('result-links-list');
  linksList.innerHTML = '';
  r.links.forEach(link => {
    const a = document.createElement('a');
    a.className = 'result-link';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noreferrer';
    a.innerHTML = link.label + ' <span>↗</span>';
    linksList.appendChild(a);
  });

  hide('screen-audience');
  hide('screen-question');
  show('screen-result');
  show('progress-bar');
  show('btn-reset');
  updateProgress();
}

function selectAudience(key) {
  state.audienceKey = key;
  state.history = [];
  state.currentQId = 'q1';
  state.resultKey = null;
  renderQuestion();
}

function handleAnswer(opt) {
  if (opt.next.startsWith('result_')) {
    state.history.push(state.currentQId);
    state.resultKey = opt.next;
    renderResult();
  } else {
    state.history.push(state.currentQId);
    state.currentQId = opt.next;
    renderQuestion();
  }
}

function goBack() {
  if (state.resultKey) {
    state.resultKey = null;
    renderQuestion();
    return;
  }
  if (state.history.length > 0) {
    state.currentQId = state.history.pop();
    renderQuestion();
  } else {
    state.audienceKey = null;
    renderAudience();
  }
}

function reset() {
  state = { audienceKey: null, history: [], currentQId: 'q1', resultKey: null };
  renderAudience();
}
