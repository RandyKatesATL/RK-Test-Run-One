<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valutek Branch Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sticky question bar over one big answer graphic per screen. Black and white with a single blue accent. */
:root{
  --bg:#f7f6f3; --card:#ffffff; --ink:#111110; --ink2:#55534e; --line:#dedbd4; --accent:#2a78d6; --accent-ink:#ffffff;
  --muted-bar:#c9c6bd;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --card:#1b1b19; --ink:#f1f0ec; --ink2:#b4b2a7; --line:#34332f; --accent:#3987e5; --accent-ink:#ffffff; --muted-bar:#4a4944;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121211; --card:#1b1b19; --ink:#f1f0ec; --ink2:#b4b2a7; --line:#34332f; --accent:#3987e5; --accent-ink:#ffffff; --muted-bar:#4a4944;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35}
body{min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center}
.brand{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px;white-space:nowrap;background:none;border:0;padding:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px}
.tab[aria-current="page"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tab[aria-current="page"] b{background:var(--accent);color:var(--accent-ink)}


.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 8px;display:block}
.brand .ttl{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding-left:12px;border-left:2px solid var(--ink);line-height:1.1}
@media(max-width:700px){.brand .ttl{display:none}.brand .logo{height:28px}}

main{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(28px,5vw,48px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--ink2);margin:0 0 20px;font-size:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;color:var(--ink2);font-weight:700}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gap16{display:flex;flex-direction:column;gap:16px}

/* home */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{border-top:3px solid var(--ink);padding-top:8px}
.kpi .v{font-size:clamp(26px,4.5vw,44px);font-weight:800;letter-spacing:-.02em}
.kpi .l{color:var(--ink2);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.tiles{grid-template-columns:1fr}}
.qt{text-align:left;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:190px;transition:transform .12s, box-shadow .12s}
.qt:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.qt .n{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.qt .q{font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.qt .big{margin-top:auto;display:flex;align-items:baseline;gap:8px}
.qt .big .v{font-size:34px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.qt .big .l{font-size:13px;color:var(--ink2)}
.go{font-weight:700;font-size:13px}

/* controls */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 13px;font-size:13px;font-weight:500}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500}
.tog i{width:30px;height:16px;border-radius:99px;background:var(--muted-bar);position:relative;flex:none}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--card);transition:left .12s}
.tog[aria-pressed="true"]{border-color:var(--ink)}
.tog[aria-pressed="true"] i{background:var(--accent)}
.tog[aria-pressed="true"] i::after{left:16px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* map */
.map{container-type:inline-size}
.mapgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.tile{aspect-ratio:1;border:1.5px solid var(--line);border-radius:7px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:11px;position:relative;line-height:1.1}
.tile .c{font-weight:800;font-size:clamp(10px,3.6cqw,15px)}
.tile .m,.tile .br{display:none;font-size:clamp(9px,2cqw,11px)}
@container (min-width:500px){.tile .m,.tile .br{display:block}}
.tile.l0{border-style:dashed;color:var(--ink2)}
.tile.l1{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.tile.l2{background:color-mix(in srgb,var(--accent) 38%,var(--card))}
.tile.l3{background:color-mix(in srgb,var(--accent) 66%,var(--card));color:#fff}
.tile.l4{background:var(--accent);color:#fff;border-color:var(--accent)}
.tile.cr{border:3px solid var(--ink)}
.tile.dim{opacity:.28}
.tile.sel{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:inline-block}
.hero{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px}
.hero .v{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.hero .l{font-size:13px;color:var(--ink2)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .t{font-weight:700;font-size:14px}
.li .s{font-size:12px;color:var(--ink2)}
.li .v{font-weight:800;text-align:right}
.li .barw{grid-column:1/-1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.li .barw i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.pill{display:inline-block;border:1.5px solid var(--ink);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.fill{background:var(--ink);color:var(--bg)}
.pill.acc{border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;background:var(--line);border-radius:6px;padding:1px 7px;font-size:11px;margin:2px 4px 0 0}
.scroll{max-height:520px;overflow:auto}

/* dots */
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted-bar);background:transparent}
.dot.on{background:var(--accent);border-color:var(--accent)}
.meter{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 14px}
.meter .v{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1}
.meter .l{font-size:13px;color:var(--ink2);max-width:210px}
.ceiling{border:2px dashed var(--ink);border-radius:12px;padding:12px 14px}
.ceiling .v{font-size:28px;font-weight:800}
.ceiling .l{font-size:12px;color:var(--ink2)}

/* wins */
.wins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:980px){.wins{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.wins{grid-template-columns:1fr}}
.win{display:flex;flex-direction:column;gap:10px}
.win .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.win .name{font-weight:800;font-size:17px;line-height:1.1}
.win .amt{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--accent);line-height:1}
.win svg{width:100%;height:auto;display:block}
.win .line{font-size:14px;font-weight:500}
svg text{fill:var(--ink2);font-family:var(--font)}

/* portfolio */
.lad{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:6px 10px;align-items:center}
.lad .g{font-weight:700;font-size:13px}
.lad .tr{height:22px;background:var(--line);border-radius:5px;position:relative;overflow:hidden}
.lad .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.lad .tr b{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px}
.lad .d{font-size:12px;text-align:right;font-weight:700}
.lad button.g{background:none;border:0;text-align:left;padding:0}
.lad button.g:hover{color:var(--accent)}
.stairs{display:flex;gap:10px;align-items:flex-end;height:170px}
.stair{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;border:0;background:none;padding:0;gap:4px}
.stair i{display:block;background:var(--muted-bar);border-radius:6px 6px 0 0;min-height:4px}
.stair[aria-pressed="true"] i{background:var(--accent)}
.stair .n{font-weight:800;font-size:20px;text-align:center}
.stair .k{font-size:12px;text-align:center;color:var(--ink2)}

/* rhythm */
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.strip{display:grid;grid-template-columns:repeat(10,13px);gap:2px}
.strip i{height:20px;border-radius:3px;border:1px solid var(--line)}
.strip i.on{border-color:transparent}
.mhead{display:grid;grid-template-columns:repeat(10,13px);gap:2px;font-size:9px;color:var(--ink2);text-align:center}
@media(max-width:520px){.strip,.mhead{grid-template-columns:repeat(10,10px)}.hrow{gap:6px}}

/* cleanroom */
.crrow{display:grid;grid-template-columns:28px 120px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.crrow:first-child{border-top:0}
.crrow .rk{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:800}
.crrow .nm{font-weight:800;font-size:14px;line-height:1.1}
.crrow .nm small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.crrow .tr{height:18px;background:var(--line);border-radius:4px;position:relative}
.crrow .tr i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.crrow .ps{text-align:right}
.crrow.sel{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
@media(max-width:560px){.crrow{grid-template-columns:24px 88px minmax(0,1fr);}.crrow .ps{display:none}}

.note{font-size:12px;color:var(--ink2);margin-top:10px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--ink2);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:20;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:14px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;height:220px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;display:none;z-index:30}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  let S=stockers(g).map(b=>b.g26[g]).sort((a,c)=>c-a);
  const nn=ACT.length-S.length; if(excl&&S.length>1)S=S.slice(1);
  const avg=S.length?S.reduce((a,c)=>a+c,0)/S.length:0;
  return {n:S.length,nn,avg,up:nn*avg};
}

function stateDetail(k,showPlay){
  if(!k)return `<div class="card"><h2>Tap a state</h2><p class="sub" style="margin:0">See its branches, what they buy, and the gap.</p></div>`;
  const s=ST[k];const list=s.list.filter(b=>b.y26>0||b.y25>0).sort((a,c)=>c.y26-a.y26);
  const max=Math.max(1,...list.map(b=>b.y26));
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${SNAME[k]||k}</h2>${CLEAN.includes(k)?'<span class="pill fill">Cleanroom state</span>':''}</div>
  <div class="hero" style="margin:8px 0"><div><div class="v num">${usd(s.sales)}</div><div class="l">2026 YTD</div></div><div><div class="v num">${s.n}</div><div class="l">active branches</div></div></div>
  ${list.length?`<div class="list scroll" style="max-height:340px">${list.map(b=>{const c=chg(b.y26,b.y25);return `<div class="li"><div><div class="t">${b.city}</div><div class="s">${b.code} · ${b.grp.length?b.grp.join(', '):'no 2026 purchases'}</div></div><div class="v num">${usd(b.y26)}</div><div class="barw"><i style="width:${b.y26/max*100}%"></i></div></div>`}).join('')}</div>`:`<p class="sub" style="margin:0">No active branches here yet. Who covers this state?</p>`}</div>`;
}
function mapScreen(){
  const crShare=cleanAct.length/usMapBr;
  return `<h1>${ROUTES[0].q}</h1><p class="sub">Tap any state. Switch to cleanroom view to see where the industry is.</p>
  <div class="grid2"><div class="card map">
    <div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="seg" role="group" aria-label="Map view"><button data-act="mapmode" data-v="sales" aria-pressed="${S.mapMode==='sales'}">Sales</button><button data-act="mapmode" data-v="clean" aria-pressed="${S.mapMode==='clean'}">Cleanroom states</button></div>
    <span class="pill">${zeroStates} states at $0</span></div>
    <div class="mapgrid">${LAYOUT.map((r,ri)=>Array.from({length:11},(_,ci)=>{const k=Object.keys(r).find(x=>r[x]===ci+1);return k?tileHTML(k):'<span></span>'}).join('')).join('')}</div>
    <div class="legend"><span><i class="sw" style="border-style:dashed"></i>$0</span><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 16%,var(--card))"></i>Under $5K</span><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 38%,var(--card))"></i>$5K+</span><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 66%,var(--card))"></i>$15K+</span><span><i class="sw" style="background:var(--accent)"></i>$30K+</span><span><i class="sw" style="border:3px solid var(--ink)"></i>Cleanroom state</span></div>
    <p class="note">Also: Mexico ${ST.MX?ST.MX.n:0} branches, ${usd(ST.MX?ST.MX.sales:0)}. Quebec ${ST.QC?ST.QC.n:0} branch, ${usd(ST.QC?ST.QC.sales:0)}.</p>
  </div>
  <div class="gap16">${S.mapMode==='clean'?`<div class="card"><h2>14 cleanroom states</h2><div class="hero" style="margin:0"><div><div class="v num">${pct(crShare)}</div><div class="l">of active branches</div></div><div><div class="v num" style="color:var(--accent)">${pct(crSales/usMapSales)}</div><div class="l">of sales</div></div></div></div>`:''}${stateDetail(S.st)}</div></div>`;
}

function listRows(arr,max,withNext){
  const shown=S.all?arr:arr.slice(0,max);
  return `<div class="list scroll">${shown.map(b=>`<div class="li"><div><div class="t">${b.city}</div><div class="s">${b.code}${b.grp.length?' · buys '+b.grp.join(', '):''}${withNext?' · try '+nextAdd(b):''}</div></div><div class="v num">${usd(b.y26)}</div></div>`).join('')}</div>${arr.length>max?`<div class="row" style="margin-top:8px"><button class="btn ghost" data-act="all">${S.all?'Show top '+max:'Show all '+arr.length}</button></div>`:''}`;
}
function nextAdd(b){const o=PEN.find(p=>!b.grp.includes(p.g));return o?o.g:'-'}
function stockScreen(){
  const g=S.group; let non=nonStock(g); if(S.clean)non=non.filter(b=>CLEAN.includes(b.st));
  const c=ceil(g,S.excl); const stk=stockers(g).sort((a,b)=>b.g26[g]-a.g26[g]);
  const dots=ACT.slice().sort((a,b)=>(b.g26[g]>0)-(a.g26[g]>0)||b.y26-a.y26).map(b=>`<span class="dot${b.g26[g]>0?' on':''}" title="${esc(b.city)}${b.g26[g]>0?': '+usd(b.g26[g]):''}"></span>`).join('');
  COPY.stock=`${g}: ${non.length} branches not stocking${S.clean?' (cleanroom states only)':''}, ranked by 2026 sales\n`+non.map(b=>`${b.code} ${b.city} | ${usd(b.y26)} | buys: ${b.grp.join(', ')}`).join('\n');
  return `<h1>${ROUTES[1].q}</h1><p class="sub">Pick a product group. Filled dots buy it. Hollow dots are your call list.</p>
  <div class="chips" style="margin-bottom:14px">${G.map(x=>`<button class="chip" data-act="group" data-v="${x}" aria-pressed="${x===g}">${x}</button>`).join('')}</div>
  <div class="grid2"><div class="card">
    <div class="meter"><div class="v num">${c.n}<span style="color:var(--ink2);font-size:.5em"> of ${ACT.length}</span></div><div class="l">branches stock <b>${g}</b>. ${c.nn} do not.</div></div>
    <div class="dots">${dots}</div>
    <div class="row" style="margin-top:14px"><span class="tag" style="font-size:12px">Top buyers: ${stk.slice(0,3).map(b=>b.city+' '+money(b.g26[g])).join(', ')||'none'}</span></div>
  </div>
  <div class="gap16"><div class="ceiling"><div class="l">CEILING, NOT A FORECAST</div><div class="v num">${usd(c.up)}</div><div class="l">${c.nn} branches × ${usd(c.avg)} average per stocking branch</div></div>
  <div class="row"><button class="tog" data-act="excl" aria-pressed="${S.excl}"><i></i>Leave out the top buyer</button><button class="tog" data-act="clean" aria-pressed="${S.clean}"><i></i>Cleanroom states only</button></div></div></div>
  <div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Call list: ${non.length} branches, best customers first</h2><button class="btn" data-act="copy" data-v="stock">Copy call list</button></div>${listRows(non,12,false)}</div>`;
}

const WINS=[
 ['DNSC',b=>pct(b.g26.Paper/gTotal('Paper'))+' of all Paper sales. Ordered '+b.n26+' of 10 months.'],
 ['SPRI',b=>pct(Math.max(...b.m26)/b.y26)+' landed in one month. Repeat is the next win.'],
 ['SPOH',b=>'Started in September and reordered in October.'],
 ['HBAL',b=>'Apparel from '+money(b.g25.Apparel||0)+' to '+money(b.g26.Apparel||0)+'. Added Mats.'],
 ['COMO',b=>pct(b.g26['Wet Wiper']/gTotal('Wet Wiper'))+' of all Wet Wiper sales.'],
 ['RMWA',b=>'Mats base, now '+b.grp.length+' product groups.'],
];
function monthly(b){
  const mx=Math.max(1,...b.m26,...b.m25);const W=26,H=54;
  const bars=b.m26.map((v,i)=>{const h25=b.m25[i]/mx*H,h26=v/mx*H,x=i*W+2;return `<rect x="${x}" y="${H-h25+4}" width="9" height="${h25}" rx="2" fill="var(--muted-bar)"/><rect x="${x+10}" y="${H-h26+4}" width="9" height="${h26}" rx="2" fill="var(--accent)"><title>${MONL[i]}: ${usd(v)} (2025: ${usd(b.m25[i])})</title></rect><text x="${x+9.5}" y="${H+16}" font-size="9" text-anchor="middle">${MON[i]}</text>`}).join('');
  return `<svg viewBox="0 0 262 ${H+20}" role="img" aria-label="Monthly sales 2026 vs 2025">${bars}</svg>`;
}
function winsScreen(){
  return `<h1>${ROUTES[2].q}</h1><p class="sub">Real branches. Copy the pattern, then find the lookalikes.</p>
  <div class="wins">${WINS.map(([code,fn])=>{const b=B.find(x=>x.code===code);const g=b.lead;return `<div class="card win"><div class="top"><div><div class="name">${b.city}</div><div class="s" style="font-size:12px;color:var(--ink2)">${b.code}</div></div><span class="pill fill">${g}</span></div>
  <div class="amt num">${usd(b.y26)}</div>${monthly(b)}
  <div class="row" style="font-size:11px;color:var(--ink2);gap:12px"><span><i class="sw" style="background:var(--accent);border:0"></i> 2026</span><span><i class="sw" style="background:var(--muted-bar);border:0"></i> 2025</span></div>
  <div class="line">${fn(b)}</div><div class="row"><button class="btn" data-act="lookalike" data-v="${g}">Find lookalikes for ${g}</button></div></div>`}).join('')}</div>`;
}

function portScreen(){
  const maxN=ACT.length;
  const rows=PEN.map(p=>{const c=ceil(p.g,S.excl);return `<button class="g" data-act="lookalike" data-v="${p.g}">${p.g}</button><div class="tr"><i style="width:${Math.max(p.n/maxN*100,1.5)}%"></i><b class="num" style="color:${p.n/maxN>.15?'#fff':'var(--ink)'};${p.n/maxN>.15?'':'left:'+(p.n/maxN*100+2)+'%'}">${p.n} of ${maxN}</b></div><div class="d num" title="Ceiling">${money(c.up)}</div>`}).join('');
  const bk=S.bk; const arr=(breadth[bk]||[]).slice().sort((a,c)=>c.y26-a.y26);
  const labels={1:'1 group',2:'2 groups',3:'3 groups',4:'4 groups'};
  const mxc=Math.max(...[1,2,3,4].map(k=>(breadth[k]||[]).length));
  const avg=k=>{const a=breadth[k]||[];return a.length?a.reduce((s,b)=>s+b.y26,0)/a.length:0};
  return `<h1>${ROUTES[3].q}</h1><p class="sub">Most branches buy one thing. Every extra group is the opportunity.</p>
  <div class="grid2"><div class="card"><h2>How many groups does each branch buy?</h2>
    <div class="stairs">${[1,2,3,4].map(k=>`<button class="stair" data-act="bk" data-v="${k}" aria-pressed="${bk===k}"><span class="n num">${(breadth[k]||[]).length}</span><i style="height:${(breadth[k]||[]).length/mxc*100*.72}%"></i><span class="k">${labels[k]}</span><span class="k num">${money(avg(k))} avg</span></button>`).join('')}</div>
    <div class="list scroll" style="margin-top:14px;max-height:320px">${arr.slice(0,bk===1?15:40).map(b=>`<div class="li"><div><div class="t">${b.city}</div><div class="s">${b.grp.join(', ')}${bk===1?' · easiest add: '+nextAdd(b):''}</div></div><div class="v num">${usd(b.y26)}</div></div>`).join('')}</div>
    ${bk===1?'<p class="note">Easiest add = the most widely stocked group this branch does not buy yet. Top 15 single-group branches shown.</p>':''}
  </div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Ladder: branches stocking each group</h2></div>
    <div class="lad">${rows}</div>
    <div class="row" style="margin-top:14px"><button class="tog" data-act="excl" aria-pressed="${S.excl}"><i></i>Leave out the top buyer</button></div>
    <p class="note">Right column is the ceiling per group: branches not stocking × average per stocking branch. Not a forecast. Tap a group to get its call list.</p></div></div>`;
}

function strip(b){
  const mx=Math.max(1,...b.m26);
  return `<div class="strip">${b.m26.map((v,i)=>v>0?`<i class="on" style="background:color-mix(in srgb,var(--accent) ${25+75*v/mx}%,var(--card))" title="${MONL[i]}: ${usd(v)}"></i>`:`<i title="${MONL[i]}: none"></i>`).join('')}</div>`;
}
function rhythmScreen(){
  const segs=[['due','Due to reorder'],['fading','Fading'],['lapsed','Lapsed'],['once','One and done'],['steady','Steady']];
  const arr=CATS[S.seg]; const txt={due:'Ordered 3+ months this year, nothing in October. Call before they ask.',fading:'Down 50% or more vs 2025. Catch them while they are still buying.',lapsed:'Bought in 2025, nothing in 2026. Win-back list.',once:'Ordered in one month only. Convert to repeat.',steady:'Ordering regularly through October. Protect and expand.'}[S.seg];
  const max=S.all?arr.length:25; const shown=arr.slice(0,max);
  COPY.rhythm=segs.find(s=>s[0]===S.seg)[1]+' ('+arr.length+')\n'+arr.map(b=>`${b.code} ${b.city} | 2025 ${usd(b.y25)} | 2026 ${usd(b.y26)} | months ordered ${b.n26}`).join('\n');
  return `<h1>${ROUTES[4].q}</h1><p class="sub">Each box is a month, January to October. Dark means a bigger order.</p>
  <div class="seg" style="margin-bottom:14px;max-width:100%;overflow-x:auto" role="group">${segs.map(([k,l])=>`<button data-act="seg" data-v="${k}" aria-pressed="${S.seg===k}">${l} <b class="num">${CATS[k].length}</b></button>`).join('')}</div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span style="font-weight:700">${txt}</span><button class="btn" data-act="copy" data-v="rhythm">Copy this list</button></div>
  <div class="hrow" style="border:0;padding:0"><span></span><div class="mhead">${MON.map(m=>`<span>${m}</span>`).join('')}</div><span></span></div>
  ${shown.map(b=>`<div class="hrow"><div><div style="font-weight:700;font-size:14px">${b.city}</div><div style="font-size:12px;color:var(--ink2)">${b.code} · 2025 ${money(b.y25)} → 2026 ${money(b.y26)}</div></div>${strip(b)}<div class="num" style="font-weight:800;min-width:56px;text-align:right">${money(S.seg==='lapsed'||S.seg==='fading'?b.y25:b.y26)}</div></div>`).join('')}
  ${arr.length>25?`<div class="row" style="margin-top:10px"><button class="btn ghost" data-act="all">${S.all?'Show top 25':'Show all '+arr.length}</button></div>`:''}</div>`;
}

function cleanScreen(){
  let arr=CLEAN.map((k,i)=>({k,rank:i+1,s:ST[k]||{sales:0,n:0,list:[]}}));
  if(S.cmode==='gap')arr=arr.slice().sort((a,c)=>a.s.sales-c.s.sales);
  const mx=Math.max(...arr.map(a=>a.s.sales));
  const pill=s=>s.n===0?'<span class="pill">No branches</span>':s.sales<5000?'<span class="pill acc">Thin</span>':'<span class="pill fill">Building</span>';
  const rows=arr.map(a=>`<button class="crrow${S.cst===a.k?' sel':''}" data-act="cst" data-v="${a.k}"><span class="rk">${a.rank}</span><span class="nm">${SNAME[a.k]}<small>${a.s.n} branch${a.s.n===1?'':'es'}</small></span><span class="tr"><i style="width:${a.s.sales/mx*100}%"></i></span><span class="ps num"><b>${money(a.s.sales)}</b><br>${pill(a.s)}</span></button>${S.cst===a.k?`<div style="padding:0 0 12px 38px">${stateDetail(a.k)}</div>`:''}`).join('');
  return `<h1>${ROUTES[5].q}</h1><p class="sub">Top 14 cleanroom states by employment. Number is the rank you provided.</p>
  <div class="hero"><div><div class="v num">${cleanAct.length} of ${usMapBr}</div><div class="l">active branches sit in these states</div></div><div><div class="v num" style="color:var(--accent)">${pct(crSales/usMapSales)}</div><div class="l">of sales come from them</div></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="seg" role="group"><button data-act="cmode" data-v="rank" aria-pressed="${S.cmode==='rank'}">By employment rank</button><button data-act="cmode" data-v="gap" aria-pressed="${S.cmode==='gap'}">Biggest gap first</button></div><span class="note" style="margin:0">Thin = under $5K. Tap a state for its branches.</span></div>${rows}</div>`;
}

/* ---------- router ---------- */
function render(){
  const h=(location.hash||'#home').slice(1);
  const id=ROUTES.find(r=>r.id===h)?h:'home';
  const fn={home,map:mapScreen,stock:stockScreen,wins:winsScreen,portfolio:portScreen,rhythm:rhythmScreen,cleanroom:cleanScreen}[id];
  document.getElementById('view').innerHTML=fn();
  document.getElementById('tabs').innerHTML=ROUTES.map((r,i)=>`<button class="tab" data-act="nav" data-v="${r.id}" ${r.id===id?'aria-current="page"':''}><b>${i+1}</b>${r.tab}</button>`).join('');
  document.getElementById('foot').innerHTML=`Source: Fastenal Branch Report, ${D.asof}. Product sales shown before the $34,000 HQ trade credit (Oct 9). Cleanroom states as provided. Ceilings are best-case averages, not forecasts.`;
}
function go(id){S.all=false;if(location.hash==='#'+id){render()}else{location.hash=id}window.scrollTo(0,0)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
async function copy(key){
  const text=COPY[key]||'';
  try{await navigator.clipboard.writeText(text);toast('Copied')}
  catch(e){const m=document.getElementById('modal'),ta=document.getElementById('ta');ta.value=text;m.classList.add('on');ta.focus();ta.select()}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==='nav'){go(v);return}
  if(a==='group'){S.group=v;S.all=false}
  else if(a==='lookalike'){S.group=v;S.all=false;go('stock');return}
  else if(a==='excl')S.excl=!S.excl;
  else if(a==='clean')S.clean=!S.clean;
  else if(a==='state')S.st=(S.st===v?null:v);
  else if(a==='mapmode')S.mapMode=v;
  else if(a==='seg'){S.seg=v;S.all=false}
  else if(a==='bk')S.bk=+v;
  else if(a==='cmode')S.cmode=v;
  else if(a==='cst')S.cst=(S.cst===v?null:v);
  else if(a==='all')S.all=!S.all;
  else if(a==='copy'){copy(v);return}
  else if(a==='closemodal'){document.getElementById('modal').classList.remove('on');return}
  const y=window.scrollY;render();window.scrollTo(0,y);
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
