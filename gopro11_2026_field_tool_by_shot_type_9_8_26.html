<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Field Cam Toolbox</title>
<style>
  :root{
    --bg:#0a0a0a;
    --bg-card:#161616;
    --bg-card-hi:#1e1e1e;
    --text:#f2f2f0;
    --text-dim:#a8a8a4;
    --orange:#ff7a1a;
    --orange-dim:#c9631a;
    --border:#2a2a2a;
    --green:#4caf7d;
    --tap-min:52px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    height:100%; overscroll-behavior-y: contain;
  }
  body{
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  /* ---------- Header / Search ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:14px 16px 12px;
  }
  header h1{
    margin:0 0 10px; font-size:20px; font-weight:800; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{color:var(--orange);}
  .search-wrap{position:relative;}
  #search{
    width:100%; height:var(--tap-min); border-radius:14px;
    border:1px solid var(--border); background:var(--bg-card);
    color:var(--text); font-size:17px; padding:0 44px 0 16px;
  }
  #search::placeholder{color:var(--text-dim);}
  .search-wrap svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none;}
  #clearSearch{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    display:none; background:none; border:none; color:var(--text-dim); font-size:20px; padding:6px;
  }

  /* ---------- Main content ---------- */
  main{padding:14px 16px 40px;}
  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:1px;
    color:var(--orange); font-weight:700; margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:6px;}
  .group-label{
    font-size:15px; font-weight:700; color:var(--text-dim);
    margin:18px 2px 8px; display:flex; align-items:center; gap:6px;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:16px; margin-bottom:10px; overflow:hidden;
  }
  .card-head{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:14px 14px; min-height:var(--tap-min);
    display:flex; align-items:center; gap:12px; font-family:inherit;
  }
  .card-head .emoji{font-size:26px; flex-shrink:0; width:32px; text-align:center;}
  .card-head .titles{flex:1; min-width:0;}
  .card-head .titles .t{font-size:16.5px; font-weight:700; line-height:1.3;}
  .card-head .titles .s{font-size:13.5px; color:var(--text-dim); margin-top:2px; line-height:1.3;}
  .chevron{flex-shrink:0; transition:transform .2s ease; color:var(--text-dim);}
  .card.open .chevron{transform:rotate(90deg); color:var(--orange);}

  .card-body{display:none; padding:0 16px 16px;}
  .card.open .card-body{display:block;}

  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .tag{
    font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:100px;
    background:#232323; color:var(--text-dim); border:1px solid var(--border);
  }

  table.settings{width:100%; border-collapse:collapse; margin-bottom:12px;}
  table.settings td{padding:9px 8px; border-bottom:1px solid var(--border); font-size:15px; vertical-align:top;}
  table.settings tr:last-child td{border-bottom:none;}
  table.settings td.k{color:var(--text-dim); font-weight:600; width:38%; padding-right:10px;}
  table.settings td.v{font-weight:600;}
  table.settings tr.crit td.v{color:var(--orange);}

  .tips{margin:0 0 12px; padding-left:0; list-style:none;}
  .tips li{
    font-size:15px; line-height:1.5; margin-bottom:8px; padding-left:22px; position:relative;
  }
  .tips li::before{content:"›"; position:absolute; left:2px; color:var(--orange); font-weight:800;}

  .warning-box{
    background:rgba(255,122,26,0.1); border:1px solid var(--orange-dim);
    border-radius:12px; padding:12px 14px; font-size:14.5px; line-height:1.5;
    color:#ffd9b3; margin-bottom:8px;
  }
  .warning-box b{color:var(--orange);}

  .fix-box{
    background:rgba(76,175,125,0.08); border:1px solid #2e6b4a;
    border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.55; margin-bottom:10px;
  }
  .fix-box b{color:var(--green);}

  .see-also{font-size:13.5px; color:var(--text-dim); margin-top:4px;}
  .see-also a{color:var(--orange); text-decoration:none; font-weight:700;}

  .empty{
    text-align:center; color:var(--text-dim); padding:60px 20px; font-size:15px; line-height:1.6;
  }

  /* ---------- Bottom tab bar ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:#111; border-top:1px solid var(--border);
    display:flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:9px 4px 8px; min-height:64px; font-family:inherit;
  }
  nav.tabbar button .ic{font-size:21px; line-height:1;}
  nav.tabbar button .lb{font-size:11px; font-weight:700; letter-spacing:0.2px;}
  nav.tabbar button.active{color:var(--orange);}
  nav.tabbar button.active .ic{transform:scale(1.05);}
</style>
</head>
<body>

<header>
  <h1><span class="dot">●</span> Field Cam Toolbox</h1>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search settings, scenes, problems..." autocomplete="off" autocorrect="off" spellcheck="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a8a4" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <button id="clearSearch" aria-label="clear">✕</button>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar">
  <button data-tab="scenario" class="active"><span class="ic">🎬</span><span class="lb">Scenario</span></button>
  <button data-tab="function"><span class="ic">⚙️</span><span class="lb">Function</span></button>
  <button data-tab="trouble"><span class="ic">🛠️</span><span class="lb">Troubleshoot</span></button>
</nav>

let activeTab = "scenario";

function cardTemplate(item, kind){
  const emoji = item.emoji || "\ud83d\udcf7";
  const subtitle = item.subtitle || "";
  let bodyHtml = "";

  if (item.tags && item.tags.length){
    bodyHtml += `<div class="tags">${item.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
  }

  if (item.settings && item.settings.length){
    bodyHtml += `<table class="settings">${item.settings.map(s=>
      `<tr class="${s.crit?'crit':''}"><td class="k">${s.k}</td><td class="v">${s.v}</td></tr>`
    ).join("")}</table>`;
  }

  if (item.tips && item.tips.length){
    bodyHtml += `<ul class="tips">${item.tips.map(t=>`<li>${t}</li>`).join("")}</ul>`;
  }

  if (item.proTip){
    bodyHtml += `<div class="warning-box">${item.proTip}</div>`;
  }
  if (item.warning){
    bodyHtml += `<div class="warning-box">${item.warning}</div>`;
  }
  if (item.fix){
    bodyHtml += `<div class="fix-box">${item.fix}</div>`;
  }

  if (item.seeAlso && item.seeAlso.length){
    bodyHtml += item.seeAlso.map(s=>`<div class="see-also"><a href="#" data-jump="${s.target}">${s.label}</a></div>`).join("");
  }

  return `
    <div class="card" id="card-${item.id}" data-id="${item.id}">
      <button class="card-head" data-toggle="${item.id}">
        <span class="emoji">${emoji}</span>
        <span class="titles">
          <span class="t">${item.title}</span>
          <span class="s">${subtitle}</span>
        </span>
        <span class="chevron">&#8250;</span>
      </button>
      <div class="card-body">${bodyHtml}</div>
    </div>
  `;
}

function render(){
  const main = document.getElementById("main");
  const q = document.getElementById("search").value.trim().toLowerCase();
  document.getElementById("clearSearch").style.display = q ? "block" : "none";

  function matches(item){
    if (!q) return true;
    const hay = JSON.stringify(item).toLowerCase();
    return hay.includes(q);
  }

  let html = "";

  if (activeTab === "scenario"){
    const items = SCENARIOS.filter(matches);
    if (!items.length){ html = emptyState(); }
    else {
      const byGroup = {};
      items.forEach(i=>{ (byGroup[i.group||"Other"] = byGroup[i.group||"Other"]||[]).push(i); });
      const order = ["Riding & Driving","On Water","On Foot","Light & Weather","Night Sky","Special Events"];
      order.forEach(g=>{
        if (byGroup[g] && byGroup[g].length){
          html += `<div class="group-label">${g}</div>`;
          html += byGroup[g].map(i=>cardTemplate(i)).join("");
        }
      });
      Object.keys(byGroup).forEach(g=>{
        if (!order.includes(g)){
          html += `<div class="group-label">${g}</div>`;
          html += byGroup[g].map(i=>cardTemplate(i)).join("");
        }
      });
    }
  }
  else if (activeTab === "function"){
    const items = FUNCTIONS.filter(matches);
    if (!items.length){ html = emptyState(); }
    else {
      const byCam = {};
      items.forEach(i=>{ (byCam[i.camera] = byCam[i.camera]||[]).push(i); });
      const order = ["GoPro","iPhone","Canon"];
      order.forEach(cam=>{
        if (byCam[cam] && byCam[cam].length){
          html += `<div class="group-label">\ud83d\udcf7 ${cam}</div>`;
          html += byCam[cam].map(i=>cardTemplate(i)).join("");
        }
      });
      Object.keys(byCam).forEach(cam=>{
        if (!order.includes(cam)){
          html += `<div class="group-label">${cam}</div>`;
          html += byCam[cam].map(i=>cardTemplate(i)).join("");
        }
      });
    }
  }
  else if (activeTab === "trouble"){
    const items = TROUBLESHOOTING.filter(matches);
    if (!items.length){ html = emptyState(); }
    else { html = items.map(i=>cardTemplate(i)).join(""); }
  }

  main.innerHTML = html;
}

function emptyState(){
  return `<div class="empty">No matches. Try a different word \u2014 or check another tab, this same info might live there under a different angle.</div>`;
}

document.querySelectorAll("nav.tabbar button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav.tabbar button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    render();
    window.scrollTo({top:0, behavior:"instant"});
  });
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("clearSearch").addEventListener("click", ()=>{
  document.getElementById("search").value = "";
  render();
});

document.getElementById("main").addEventListener("click", (e)=>{
  const toggleBtn = e.target.closest("[data-toggle]");
  if (toggleBtn){
    const card = toggleBtn.closest(".card");
    card.classList.toggle("open");
    return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump){
    e.preventDefault();
    const targetId = jump.dataset.jump;
    // figure out which tab that card lives in
    let targetTab = null;
    if (SCENARIOS.find(s=>s.id===targetId)) targetTab = "scenario";
    else if (FUNCTIONS.find(f=>f.id===targetId)) targetTab = "function";
    else if (TROUBLESHOOTING.find(t=>t.id===targetId)) targetTab = "trouble";
    if (targetTab && targetTab !== activeTab){
      activeTab = targetTab;
      document.querySelectorAll("nav.tabbar button").forEach(b=>b.classList.remove("active"));
      document.querySelector(`nav.tabbar button[data-tab="${targetTab}"]`).classList.add("active");
      render();
    }
    setTimeout(()=>{
      const el = document.getElementById("card-"+targetId);
      if (el){
        el.classList.add("open");
        el.scrollIntoView({behavior:"smooth", block:"start"});
      }
    }, 30);
  }
});

render();
</script>
