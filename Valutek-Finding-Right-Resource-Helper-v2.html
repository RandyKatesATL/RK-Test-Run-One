};

let audKey=null, history=[], curQ="q1", resKey=null;

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}

function updateProgress(){
  const steps = history.length + (resKey ? 1 : 0);
  document.getElementById('step-lbl').textContent = 'Step ' + (steps+1);
  for(let i=0;i<4;i++) document.getElementById('pb'+i).classList.toggle('active', i<=steps);
}

function renderAudience(){
  show('screen-audience'); hide('screen-question'); hide('screen-result');
  hide('progress'); hide('btn-reset');
}

function renderQuestion(){
  const flow = FLOWS[audKey];
  const q = flow.questions[curQ];
  document.getElementById('q-aud').textContent = flow.label;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('q-sub').textContent = q.subtitle || '';
  const c = document.getElementById('q-opts'); c.innerHTML = '';
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span>'+opt.label+'</span><span class="arr">→</span>';
    b.onclick = () => handleAnswer(opt);
    c.appendChild(b);
  });
  hide('screen-audience'); show('screen-question'); hide('screen-result');
  show('progress'); show('btn-reset'); updateProgress();
}

function renderResult(){
  const r = FLOWS[audKey].results[resKey];
  document.getElementById('r-hdr').style.background = r.color;
  document.getElementById('r-icon').textContent = r.icon;
  document.getElementById('r-cat').textContent = r.cat;
  document.getElementById('r-hl').textContent = r.hl;
  document.getElementById('r-desc').textContent = r.desc;
  const lc = document.getElementById('r-links'); lc.innerHTML = '';
  r.links.forEach(l => {
    const a = document.createElement('a');
    a.className = 'link'; a.href = l.url; a.target = '_blank'; a.rel = 'noreferrer';
    a.innerHTML = l.label + ' <span style="color:#aaa">↗</span>';
    lc.appendChild(a);
  });
  hide('screen-audience'); hide('screen-question'); show('screen-result');
  show('progress'); show('btn-reset'); updateProgress();
}

function selectAudience(key){ audKey=key; history=[]; curQ='q1'; resKey=null; renderQuestion(); }

function handleAnswer(opt){
  if(opt.next.startsWith('result_')){ history.push(curQ); resKey=opt.next; renderResult(); }
  else{ history.push(curQ); curQ=opt.next; renderQuestion(); }
}

function goBack(){
  if(resKey){ resKey=null; renderQuestion(); return; }
  if(history.length>0){ curQ=history.pop(); renderQuestion(); }
  else{ audKey=null; renderAudience(); }
}

function reset(){ audKey=null; history=[]; curQ='q1'; resKey=null; renderAudience(); }
</script>
